<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下單成功！— 小蘋果團購</title>
  <meta name="description" content="感謝您的訂購，小蘋果團購將盡快為您處理訂單。">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<nav class="navbar">
  <a href="index.html" class="navbar-brand">
    <div class="logo-icon">🍎</div>
    小蘋果團購
  </a>
</nav>

<div class="success-page">
  <div class="success-card">
    <div class="success-icon">🎉</div>
    <h1 class="success-title">下單成功！</h1>
    <p class="success-desc">感謝您的訂購，我們會盡快與您確認訂單與出貨。</p>

    <div class="order-code">
      <div class="order-code-label">您的訂單編號</div>
      <div class="order-code-value" id="orderCodeDisplay">-</div>
    </div>

    <!-- Order Details Box -->
    <div id="orderDetails" style="text-align:left;margin-bottom:24px;">
      <div style="background:var(--bg);border-radius:var(--radius-sm);padding:20px;border:1px solid var(--border);">
        <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:0.9rem;">
          <span style="color:var(--text-light)">商品</span>
          <span style="color:var(--text-dark);font-weight:600;" id="successProductName">-</span>
        </div>
        <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:0.9rem;display:none;" id="successVariantRow">
          <span style="color:var(--text-light)">規格</span>
          <span style="color:var(--text-dark);font-weight:500;" id="successVariant">-</span>
        </div>
        <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:0.9rem;">
          <span style="color:var(--text-light)">數量</span>
          <span style="color:var(--text-dark);font-weight:500;" id="successQty">-</span>
        </div>
        <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:0.9rem;">
          <span style="color:var(--text-light)">付款方式</span>
          <span style="color:var(--text-dark);font-weight:500;" id="successPayment">🏦 銀行轉帳</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border);font-size:1.05rem;font-weight:700;">
          <span style="color:var(--text-dark)">總金額</span>
          <span style="color:var(--primary);" id="successTotal">NT$ 0</span>
        </div>
      </div>
    </div>

    <!-- Bank Transfer Details & Reconciliation Box -->
    <div style="background:var(--bg-section);border-radius:var(--radius-sm);padding:20px;margin-bottom:24px;border-left:4px solid var(--secondary);text-align:left;">
      <h3 style="font-size:0.95rem;font-weight:700;color:var(--secondary);margin-bottom:10px;display:flex;align-items:center;gap:6px;">
        <span>🏦</span> 匯款帳號資訊
      </h3>
      <p style="font-size:0.88rem;margin-bottom:4px;">銀行：<strong>國泰世華 (013) 永貞分行</strong></p>
      <p style="font-size:0.88rem;margin-bottom:4px;">帳號：<strong style="font-family:monospace;font-size:1.05rem;color:var(--primary);letter-spacing:1px;">273506144813</strong></p>
      <p style="font-size:0.88rem;margin-bottom:14px;">戶名：<strong>鍾沛蓉</strong></p>

      <div style="border-top:1px dashed var(--border);padding-top:14px;">
        <label style="font-size:0.85rem;font-weight:600;color:var(--text-dark);display:block;margin-bottom:6px;">
          💳 匯款後五碼回填（方便我們快速對帳）：
        </label>
        <div style="display:flex;gap:8px;">
          <input type="text" class="form-control" id="updateBankLast5" placeholder="例如：12345" style="background:white;padding:8px 12px;font-size:0.9rem;" maxlength="10">
          <button class="btn btn-primary btn-sm" id="saveLast5Btn" onclick="saveBankLast5()" style="white-space:nowrap;padding:8px 16px;">
            確認回填
          </button>
        </div>
        <p style="font-size:0.75rem;color:var(--text-light);margin-top:6px;" id="last5StatusMsg">
          轉帳完成後輸入末五碼並點擊確認，管理員即可即時核對您的款項。
        </p>
      </div>
    </div>

    <!-- Actions -->
    <div style="display:flex;flex-direction:column;gap:12px;">
      <button class="btn btn-primary" onclick="openReviewModal()">
        ⭐ 為此商品撰寫評價
      </button>
      <a href="index.html" class="btn btn-secondary">
        繼續逛逛商品 🛍️
      </a>
    </div>

    <p style="margin-top:24px;font-size:0.82rem;color:var(--text-light);">
      如有任何問題請聯絡客服，請記得保留您的訂單編號！🍎
    </p>
  </div>
</div>

<!-- Review Modal on Success Page -->
<div class="modal-overlay" id="reviewModal">
  <div class="modal" style="max-width:480px;text-align:left;">
    <div class="modal-header">
      <h3 class="modal-title">⭐ 為商品留下評價</h3>
      <button class="modal-close" onclick="closeReviewModal()">✕</button>
    </div>
    <div class="modal-body">
      <form id="reviewForm" onsubmit="handleReviewSubmit(event)">
        <div class="form-group">
          <label class="form-label">商品評分 <span class="required">*</span></label>
          <div class="star-picker" id="starPicker">
            <span class="star active" data-rating="1">★</span>
            <span class="star active" data-rating="2">★</span>
            <span class="star active" data-rating="3">★</span>
            <span class="star active" data-rating="4">★</span>
            <span class="star active" data-rating="5">★</span>
          </div>
          <input type="hidden" id="reviewRating" value="5">
        </div>

        <div class="form-group">
          <label class="form-label" for="reviewerName">您的稱呼 / 暱稱 <span class="required">*</span></label>
          <input type="text" class="form-control" id="reviewerName" placeholder="例如：陳小姐、林先生" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reviewComment">心得評價 <span class="required">*</span></label>
          <textarea class="form-control" id="reviewComment" placeholder="分享您對商品的評價與心得..." required style="min-height:100px;"></textarea>
        </div>

        <div style="display:flex;gap:12px;margin-top:20px;">
          <button type="button" class="btn btn-secondary" onclick="closeReviewModal()" style="flex:1;">取消</button>
          <button type="submit" class="btn btn-primary" id="submitReviewBtn" style="flex:2;">送出評價 ✨</button>
        </div>
      </form>
    </div>
  </div>
</div>

<footer class="footer">
  <p>© 2026 小蘋果團購 · 好物共享，揪團更划算 🍎</p>
</footer>

<script type="module">
  import { db } from './js/firebase-config.js';
  import { doc, updateDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const order = JSON.parse(sessionStorage.getItem('lastOrder') || '{}');

  function showToast(msg, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type === 'error' ? 'error' : ''}`;
    toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> ${msg}`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
  }

  if (!order.orderCode) {
    window.location.href = 'index.html';
  } else {
    document.getElementById('orderCodeDisplay').textContent = order.orderCode;
    document.getElementById('successProductName').textContent = order.productName || '-';
    document.getElementById('successQty').textContent = `${order.quantity} 件`;
    document.getElementById('successTotal').textContent = `NT$ ${Number(order.totalAmount).toLocaleString()}`;

    if (order.variantName) {
      const variantRow = document.getElementById('successVariantRow');
      variantRow.style.display = 'flex';
      document.getElementById('successVariant').textContent = order.variantName;
    }

    if (order.buyerName) {
      document.getElementById('reviewerName').value = order.buyerName;
    }

    if (order.bankLast5) {
      document.getElementById('updateBankLast5').value = order.bankLast5;
      document.getElementById('last5StatusMsg').textContent = `✅ 目前已登記末五碼：${order.bankLast5}（如更換帳號可再次修改）`;
      document.getElementById('last5StatusMsg').style.color = 'var(--secondary)';
      document.getElementById('last5StatusMsg').style.fontWeight = '600';
    }
  }

  window.saveBankLast5 = async () => {
    const val = document.getElementById('updateBankLast5').value.trim();
    if (!val) {
      showToast('請輸入匯款帳號後五碼', 'error');
      return;
    }

    const btn = document.getElementById('saveLast5Btn');
    btn.disabled = true;
    btn.textContent = '儲存中...';

    try {
      if (order.orderId) {
        await updateDoc(doc(db, 'orders', order.orderId), { bankLast5: val });
      }
      showToast('匯款後五碼已成功回填！');
      document.getElementById('last5StatusMsg').textContent = `✅ 目前已登記末五碼：${val}（已更新）`;
      document.getElementById('last5StatusMsg').style.color = 'var(--secondary)';
      document.getElementById('last5StatusMsg').style.fontWeight = '600';

      order.bankLast5 = val;
      sessionStorage.setItem('lastOrder', JSON.stringify(order));
    } catch (err) {
      console.error(err);
      showToast('更新失敗，請稍後再試', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '確認回填';
    }
  };

  // Star Picker
  let selectedRating = 5;
  const starElements = document.querySelectorAll('#starPicker .star');
  starElements.forEach(star => {
    star.addEventListener('click', () => {
      selectedRating = parseInt(star.dataset.rating);
      document.getElementById('reviewRating').value = selectedRating;
      updateStarPicker();
    });

    star.addEventListener('mouseenter', () => {
      const hoverRating = parseInt(star.dataset.rating);
      starElements.forEach(s => {
        if (parseInt(s.dataset.rating) <= hoverRating) {
          s.classList.add('hovered');
        } else {
          s.classList.remove('hovered');
        }
      });
    });
  });

  document.getElementById('starPicker').addEventListener('mouseleave', () => {
    starElements.forEach(s => s.classList.remove('hovered'));
  });

  function updateStarPicker() {
    starElements.forEach(s => {
      if (parseInt(s.dataset.rating) <= selectedRating) {
        s.classList.add('active');
      } else {
        s.classList.remove('active');
      }
    });
  }

  window.openReviewModal = () => {
    document.getElementById('reviewModal').classList.add('show');
  };

  window.closeReviewModal = () => {
    document.getElementById('reviewModal').classList.remove('show');
  };

  window.handleReviewSubmit = async (e) => {
    e.preventDefault();
    const name = document.getElementById('reviewerName').value.trim();
    const comment = document.getElementById('reviewComment').value.trim();
    const rating = parseInt(document.getElementById('reviewRating').value) || 5;

    if (!name || !comment) {
      showToast('請填寫評價內容', 'error');
      return;
    }

    const submitBtn = document.getElementById('submitReviewBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = '送出中...';

    try {
      await addDoc(collection(db, 'reviews'), {
        productId: order.productId || '',
        productName: order.productName || '',
        reviewerName: name,
        rating,
        comment,
        createdAt: serverTimestamp()
      });

      showToast('感謝您的寶貴評價！✨');
      closeReviewModal();
    } catch (err) {
      console.error(err);
      showToast('評價送出失敗，請稍後再試', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '送出評價 ✨';
    }
  };

  document.getElementById('reviewModal').addEventListener('click', function(e) {
    if (e.target === this) closeReviewModal();
  });
</script>

</body>
</html>
