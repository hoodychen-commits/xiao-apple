<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品管理 — 小蘋果後台</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
  <style>
    .variants-section {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      background: var(--bg);
    }
    .variant-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 10px;
      padding: 12px;
      background: var(--bg-section);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .variant-row .form-group {
      margin-bottom: 0;
    }
    .variant-row .form-label {
      font-size: 0.78rem;
      margin-bottom: 4px;
    }
    .variant-remove-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-light);
      cursor: pointer;
      border-radius: var(--radius-sm);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s;
    }
    .variant-remove-btn:hover {
      background: #FFF0F0;
      color: var(--primary);
      border-color: var(--primary);
    }
    .variant-add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      background: var(--bg-section);
      border: 2px dashed var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-mid);
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .variant-add-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: #FFF5F5;
    }
    @media (max-width: 600px) {
      .variant-row {
        grid-template-columns: 1fr 1fr;
      }
      .variant-row .form-group:first-child {
        grid-column: 1 / -1;
      }
      .variant-remove-btn {
        justify-self: end;
      }
    }
  </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay" style="display:none;">
  <div class="spinner"></div>
  <p style="color:var(--text-mid);" id="loadingText">處理中...</p>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header">
      <h3 class="modal-title">⚠️ 確認刪除</h3>
      <button class="modal-close" onclick="closeDeleteModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-mid);">確定要刪除商品「<strong id="deleteProductName"></strong>」嗎？此操作無法復原。</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeDeleteModal()">取消</button>
      <button class="btn btn-primary" id="confirmDeleteBtn" onclick="confirmDelete()">確認刪除</button>
    </div>
  </div>
</div>

<!-- Product Modal -->
<div class="modal-overlay" id="productModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">新增商品</h3>
      <button class="modal-close" onclick="closeProductModal()">✕</button>
    </div>
    <div class="modal-body">
      <form id="productForm">
        <input type="hidden" id="editProductId">

        <div class="form-group">
          <label class="form-label" for="pName">商品名稱 <span class="required">*</span></label>
          <input type="text" class="form-control" id="pName" placeholder="請輸入商品名稱" required>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div class="form-group">
            <label class="form-label" for="pCategory">分類</label>
            <input type="text" class="form-control" id="pCategory" placeholder="如：零食、保養、日用品">
          </div>
          <div class="form-group">
            <label class="form-label" for="pUnit">單位</label>
            <input type="text" class="form-control" id="pUnit" placeholder="如：件、盒、包">
          </div>
        </div>

        <!-- 產品種類 / 規格 -->
        <div class="form-group">
          <label class="form-label">產品種類 / 價格 <span class="required">*</span></label>
          <div class="variants-section">
            <div id="variantsContainer"></div>
            <button type="button" class="variant-add-btn" onclick="addVariantRow()">
              ＋ 新增種類
            </button>
          </div>
          <p style="font-size:0.78rem;color:var(--text-light);margin-top:6px;">
            每個種類可設定不同的名稱、價格和庫存。如只有一種規格，種類名稱可留空。
          </p>
        </div>

        <div class="form-group">
          <label class="form-label" for="pDeadline">截止日期</label>
          <input type="date" class="form-control" id="pDeadline">
        </div>

        <div class="form-group">
          <label class="form-label" for="pDesc">商品說明</label>
          <textarea class="form-control" id="pDesc" placeholder="商品詳細說明..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">商品圖片（最多10張）</label>
          <div class="file-upload" id="fileUploadArea">
            <input type="file" id="pImage" accept="image/*" multiple onchange="handleImageSelect(event)">
            <div class="file-upload-icon">📷</div>
            <p class="file-upload-text"><strong>點擊選擇多張圖片</strong>或拖放圖片至此</p>
          </div>
          <div class="image-preview-grid" id="imagePreviewGrid"></div>
          <p style="font-size:0.78rem;color:var(--text-light);margin-top:6px;" id="currentImageNote"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="pStatus">狀態</label>
          <select class="form-control" id="pStatus">
            <option value="active">✅ 開團中</option>
            <option value="ended">⛔ 已截止</option>
            <option value="draft">📝 草稿</option>
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeProductModal()">取消</button>
      <button class="btn btn-primary" onclick="saveProduct()">💾 儲存商品</button>
    </div>
  </div>
</div>

<!-- Layout -->
<div class="admin-layout">

  <aside class="admin-sidebar">
    <div class="admin-logo"><span>🍎</span> 小蘋果後台</div>
    <ul class="admin-nav">
      <li><a href="dashboard.html">📊 數據儀表板</a></li>
      <li><a href="products.html" class="active">📦 商品管理</a></li>
      <li><a href="orders.html">🧾 訂單管理</a></li>
      <li style="margin-top:auto;padding-top:24px;">
        <a href="#" onclick="handleLogout()" style="color:var(--text-light);">🚪 登出</a>
      </li>
    </ul>
    <div style="padding:16px 12px 0;border-top:1px solid var(--border);margin-top:24px;">
      <p style="font-size:0.78rem;color:var(--text-light);">登入帳號</p>
      <p style="font-size:0.85rem;color:var(--text-mid);font-weight:500;margin-top:2px;" id="userEmail">-</p>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h2 class="admin-page-title">📦 商品管理</h2>
      <button class="btn btn-primary" id="addProductBtn" onclick="openAddModal()">
        ＋ 新增商品
      </button>
    </div>

    <!-- Filter Bar -->
    <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" id="filterAll" onclick="filterProducts('all')">全部</button>
      <button class="btn btn-secondary btn-sm" id="filterActive" onclick="filterProducts('active')">開團中</button>
      <button class="btn btn-secondary btn-sm" id="filterEnded" onclick="filterProducts('ended')">已截止</button>
      <button class="btn btn-secondary btn-sm" id="filterDraft" onclick="filterProducts('draft')">草稿</button>
    </div>

    <!-- Products Table -->
    <div class="admin-table-wrapper">
      <div id="productsTableLoading" style="text-align:center;padding:48px;">
        <div class="spinner"></div>
      </div>
      <div id="productsTableEmpty" style="display:none;">
        <div class="empty-state">
          <div class="empty-state-icon">📦</div>
          <h3>尚無商品</h3>
          <p>點擊右上角「新增商品」開始上架吧！</p>
        </div>
      </div>
      <table class="admin-table" id="productsTable" style="display:none;">
        <thead>
          <tr>
            <th>圖片</th>
            <th>商品名稱</th>
            <th>分類</th>
            <th>種類 / 價格</th>
            <th>瀏覽數</th>
            <th>截止日</th>
            <th>狀態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="productsTableBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
  import { auth, db, storage } from '../js/firebase-config.js';
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    collection, getDocs, addDoc, updateDoc, deleteDoc, doc,
    serverTimestamp, query, orderBy, deleteField
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import {
    ref, uploadBytes, getDownloadURL, deleteObject
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  let allProducts = [];
  let currentFilter = 'all';
  let deleteTargetId = null;
  let selectedFiles = [];
  let existingImages = [];
  let deletedPaths = [];

  // Auth Guard
  onAuthStateChanged(auth, user => {
    if (!user) { window.location.href = 'index.html'; return; }
    document.getElementById('userEmail').textContent = user.email;
    loadProducts();
  });

  window.handleLogout = async () => {
    await signOut(auth);
    window.location.href = 'index.html';
  };

  function showToast(msg, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type === 'error' ? 'error' : ''}`;
    toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> ${msg}`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
  }

  function showLoading(show, text = '處理中...') {
    const overlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    if (loadingText) loadingText.textContent = text;
    overlay.style.display = show ? 'flex' : 'none';
  }

  // === Variant Management ===
  let variantCounter = 0;

  window.addVariantRow = (data = {}) => {
    const container = document.getElementById('variantsContainer');
    const id = variantCounter++;
    const row = document.createElement('div');
    row.className = 'variant-row';
    row.dataset.variantId = id;
    row.innerHTML = `
      <div class="form-group">
        <label class="form-label">種類名稱</label>
        <input type="text" class="form-control variant-name" placeholder="如：白蛋、紅蛋" value="${escapeHtml(data.name || '')}">
      </div>
      <div class="form-group">
        <label class="form-label">價格 (NT$) <span class="required">*</span></label>
        <input type="number" class="form-control variant-price" placeholder="0" min="0" value="${data.price !== undefined && data.price !== '' ? data.price : ''}" required>
      </div>
      <div class="form-group">
        <label class="form-label">庫存數量</label>
        <input type="number" class="form-control variant-stock" placeholder="留空=無限" value="${data.stock !== undefined && data.stock !== null ? data.stock : ''}">
      </div>
      <button type="button" class="variant-remove-btn" onclick="removeVariantRow(${id})" title="刪除此種類">✕</button>
    `;
    container.appendChild(row);
    updateRemoveButtons();
  };

  window.removeVariantRow = (id) => {
    const row = document.querySelector(`.variant-row[data-variant-id="${id}"]`);
    if (row) row.remove();
    updateRemoveButtons();
  };

  function updateRemoveButtons() {
    const rows = document.querySelectorAll('.variant-row');
    rows.forEach(row => {
      const btn = row.querySelector('.variant-remove-btn');
      if (rows.length <= 1) {
        btn.style.visibility = 'hidden';
      } else {
        btn.style.visibility = 'visible';
      }
    });
  }

  function getVariantsFromForm() {
    const rows = document.querySelectorAll('.variant-row');
    const variants = [];
    rows.forEach(row => {
      const name = row.querySelector('.variant-name').value.trim();
      const price = parseFloat(row.querySelector('.variant-price').value);
      const stockVal = row.querySelector('.variant-stock').value;
      const variant = { name, price };
      if (stockVal !== '') {
        variant.stock = parseInt(stockVal);
      }
      variants.push(variant);
    });
    return variants;
  }

  // === Product Loading ===
  async function loadProducts() {
    try {
      const snap = await getDocs(collection(db, 'products'));
      allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      allProducts.sort((a, b) => {
        const timeA = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : (a.createdAt?.seconds ? a.createdAt.seconds * 1000 : 0);
        const timeB = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : (b.createdAt?.seconds ? b.createdAt.seconds * 1000 : 0);
        return timeB - timeA;
      });
      renderTable();
    } catch (err) {
      console.error('載入商品錯誤:', err);
      showToast('載入商品失敗', 'error');
    } finally {
      document.getElementById('productsTableLoading').style.display = 'none';
    }
  }

  function renderTable() {
    const filtered = currentFilter === 'all'
      ? allProducts
      : allProducts.filter(p => p.status === currentFilter);

    const tbody = document.getElementById('productsTableBody');
    const table = document.getElementById('productsTable');
    const empty = document.getElementById('productsTableEmpty');

    if (filtered.length === 0) {
      table.style.display = 'none';
      empty.style.display = 'block';
      return;
    }

    table.style.display = 'table';
    empty.style.display = 'none';

    tbody.innerHTML = filtered.map(p => {
      const statusMap = {
        active: '<span class="badge badge-active">✅ 開團中</span>',
        ended: '<span class="badge">⛔ 已截止</span>',
        draft: '<span class="badge" style="background:#F5F5F5;color:#999;">📝 草稿</span>'
      };

      const imgHtml = p.imageUrl
        ? `<div class="product-thumb"><img src="${p.imageUrl}" alt="${p.name}"></div>`
        : `<div class="product-thumb">🛍️</div>`;

      const deadline = p.deadline
        ? new Date(p.deadline).toLocaleDateString('zh-TW')
        : '長期';

      // 價格顯示：支援多種類
      let priceHtml = '';
      if (p.variants && Array.isArray(p.variants) && p.variants.length > 0) {
        if (p.variants.length === 1) {
          const v = p.variants[0];
          const label = v.name ? `${escapeHtml(v.name)}: ` : '';
          const stockStr = v.stock !== undefined ? ` (庫存: ${v.stock})` : '';
          priceHtml = `${label}NT$ ${Number(v.price).toLocaleString()}${stockStr}`;
        } else {
          priceHtml = p.variants.map(v => {
            const stockStr = v.stock !== undefined ? ` (${v.stock})` : '';
            return `<div style="font-size:0.82rem;margin-bottom:2px;">${escapeHtml(v.name || '預設')}: NT$${Number(v.price).toLocaleString()}${stockStr}</div>`;
          }).join('');
        }
      } else {
        // 向下相容舊資料
        const stockStr = p.stock !== undefined ? ` (庫存: ${p.stock})` : '';
        priceHtml = `NT$ ${Number(p.price).toLocaleString()}${stockStr}`;
      }

      return `
        <tr>
          <td>${imgHtml}</td>
          <td style="font-weight:600;max-width:180px;">${escapeHtml(p.name)}</td>
          <td><span class="badge badge-active" style="background:var(--bg-section);color:var(--text-mid);">${escapeHtml(p.category || '-')}</span></td>
          <td style="font-weight:600;color:var(--primary);max-width:200px;">${priceHtml}</td>
          <td>👁️ ${p.views || 0}</td>
          <td style="font-size:0.85rem;color:var(--text-light);">${deadline}</td>
          <td>${statusMap[p.status] || '-'}</td>
          <td>
            <div style="display:flex;gap:6px;">
              <button class="btn btn-secondary btn-sm" onclick="openEditModal('${p.id}')">編輯</button>
              <button class="btn btn-sm" style="background:var(--bg-section);color:var(--primary);" onclick="openDeleteModal('${p.id}','${escapeHtml(p.name)}')">刪除</button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // Filter
  window.filterProducts = (filter) => {
    currentFilter = filter;
    ['All','Active','Ended','Draft'].forEach(f => {
      document.getElementById(`filter${f}`)?.classList.remove('btn-primary');
      document.getElementById(`filter${f}`)?.classList.add('btn-secondary');
    });
    document.getElementById(`filter${filter.charAt(0).toUpperCase()+filter.slice(1)}`)?.classList.replace('btn-secondary','btn-primary');
    renderTable();
  };

  // Image select
  window.handleImageSelect = (event) => {
    const files = Array.from(event.target.files);
    if (!files.length) return;

    const totalCount = existingImages.length + selectedFiles.length + files.length;
    if (totalCount > 10) {
      showToast('最多只能上傳 10 張圖片！', 'error');
      event.target.value = '';
      return;
    }

    files.forEach(file => {
      selectedFiles.push(file);
    });

    event.target.value = ''; // Reset input
    renderImagePreviews();
  };

  // Render Image Previews Grid
  function renderImagePreviews() {
    const grid = document.getElementById('imagePreviewGrid');
    grid.innerHTML = '';

    // Render existing images
    existingImages.forEach((img, idx) => {
      const item = document.createElement('div');
      item.className = 'preview-item';
      item.innerHTML = `
        <img src="${img.url}" alt="現有圖片">
        <button class="delete-btn" type="button" onclick="removeExistingImage(${idx})">✕</button>
      `;
      grid.appendChild(item);
    });

    // Render new selected files
    selectedFiles.forEach((file, idx) => {
      const item = document.createElement('div');
      item.className = 'preview-item';

      const img = document.createElement('img');
      img.alt = '待上傳';

      const reader = new FileReader();
      reader.onload = e => { img.src = e.target.result; };
      reader.readAsDataURL(file);

      item.appendChild(img);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.type = 'button';
      deleteBtn.textContent = '✕';
      deleteBtn.onclick = () => removeSelectedFile(idx);

      item.appendChild(deleteBtn);
      grid.appendChild(item);
    });
  }

  // Remove existing image
  window.removeExistingImage = (idx) => {
    const img = existingImages[idx];
    if (img.path) {
      deletedPaths.push(img.path);
    }
    existingImages.splice(idx, 1);
    renderImagePreviews();
  };

  // Remove new selected file
  window.removeSelectedFile = (idx) => {
    selectedFiles.splice(idx, 1);
    renderImagePreviews();
  };

  // Open Add Modal
  window.openAddModal = () => {
    document.getElementById('modalTitle').textContent = '新增商品';
    document.getElementById('productForm').reset();
    document.getElementById('editProductId').value = '';
    document.getElementById('currentImageNote').textContent = '';
    selectedFiles = [];
    existingImages = [];
    deletedPaths = [];
    renderImagePreviews();
    // Reset variants
    variantCounter = 0;
    document.getElementById('variantsContainer').innerHTML = '';
    addVariantRow();
    document.getElementById('productModal').classList.add('show');
  };

  // Open Edit Modal
  window.openEditModal = (id) => {
    const product = allProducts.find(p => p.id === id);
    if (!product) return;

    document.getElementById('modalTitle').textContent = '編輯商品';
    document.getElementById('editProductId').value = id;
    document.getElementById('pName').value = product.name || '';
    document.getElementById('pCategory').value = product.category || '';
    document.getElementById('pUnit').value = product.unit || '';
    document.getElementById('pDeadline').value = product.deadline || '';
    document.getElementById('pDesc').value = product.description || '';
    document.getElementById('pStatus').value = product.status || 'active';

    selectedFiles = [];
    existingImages = [];
    deletedPaths = [];

    if (product.imageUrls && Array.isArray(product.imageUrls)) {
      product.imageUrls.forEach((url, i) => {
        const path = (product.imagePaths && product.imagePaths[i]) || '';
        existingImages.push({ url, path });
      });
    } else if (product.imageUrl) {
      existingImages.push({ url: product.imageUrl, path: product.imagePath || '' });
    }

    renderImagePreviews();
    document.getElementById('currentImageNote').textContent = existingImages.length > 0 ? '目前已有圖片如上，可增刪' : '';

    // Load variants
    variantCounter = 0;
    document.getElementById('variantsContainer').innerHTML = '';
    if (product.variants && Array.isArray(product.variants) && product.variants.length > 0) {
      product.variants.forEach(v => addVariantRow(v));
    } else {
      // 向下相容：舊商品只有單一價格
      addVariantRow({
        name: '',
        price: product.price || '',
        stock: product.stock
      });
    }

    document.getElementById('productModal').classList.add('show');
  };

  window.closeProductModal = () => {
    document.getElementById('productModal').classList.remove('show');
  };

  // Wrap any promise with a timeout
  function withTimeout(promise, timeoutMs, errorMsg) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        reject(new Error(errorMsg || `操作超時（${timeoutMs / 1000}秒），請檢查網路連線後重試。`));
      }, timeoutMs);

      promise
        .then(result => {
          clearTimeout(timer);
          resolve(result);
        })
        .catch(err => {
          clearTimeout(timer);
          reject(err);
        });
    });
  }

  // Client-side image compression to optimize file size and generate Base64 fallback
  function compressImage(file, maxWidth = 1000, maxHeight = 1000, quality = 0.75) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > maxWidth || height > maxHeight) {
            if (width / height > maxWidth / maxHeight) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            } else {
              width = Math.round((width * maxHeight) / height);
              height = maxHeight;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL('image/jpeg', quality);

          canvas.toBlob((blob) => {
            resolve({ dataUrl, blob: blob || file });
          }, 'image/jpeg', quality);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // Save Product
  window.saveProduct = async () => {
    const name = document.getElementById('pName').value.trim();
    const variants = getVariantsFromForm();

    if (!name) {
      showToast('請填寫商品名稱', 'error');
      return;
    }

    // 驗證種類
    const invalidVariants = variants.filter(v => isNaN(v.price) || v.price < 0);
    if (variants.length === 0 || invalidVariants.length > 0) {
      showToast('請至少填寫一組種類並輸入有效價格', 'error');
      return;
    }

    showLoading(true, '正在處理圖片與儲存商品...');
    console.log('[saveProduct] 開始處理儲存商品...');

    try {
      const editId = document.getElementById('editProductId').value;
      console.log('[saveProduct] Edit ID:', editId);

      // 1. Delete removed images from storage (best-effort)
      if (deletedPaths.length > 0) {
        console.log('[saveProduct] 開始刪除舊圖片 (數量: ' + deletedPaths.length + ')');
        for (const path of deletedPaths) {
          if (path) {
            try {
              console.log('[saveProduct] 刪除圖片:', path);
              await withTimeout(deleteObject(ref(storage, path)), 6000, '刪除舊圖片超時');
            } catch (e) {
              console.warn('Delete old image error (ignored):', e);
            }
          }
        }
      }

      // 2. Process and upload new images in parallel with Storage and Base64 fallback
      let uploadedImages = [];
      if (selectedFiles.length > 0) {
        showLoading(true, `正在處理 ${selectedFiles.length} 張圖片...`);
        console.log('[saveProduct] 開始平行處理圖片 (數量: ' + selectedFiles.length + ')');

        const uploadPromises = selectedFiles.map(async (file, idx) => {
          try {
            // 壓縮圖片
            const { dataUrl, blob } = await compressImage(file, 1000, 1000, 0.75);

            // 嘗試上傳至 Firebase Storage
            const sanitizedName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
            const path = `products/${Date.now()}_${Math.random().toString(36).substring(2, 7)}_${sanitizedName}`;
            const imgRef = ref(storage, path);

            try {
              const uploadPromise = uploadBytes(imgRef, blob)
                .then(snap => getDownloadURL(snap.ref))
                .then(url => ({ url, path: imgRef.fullPath }))
                .catch(err => { throw err; });

              const storageResult = await withTimeout(uploadPromise, 4000, 'Storage upload timeout');
              console.log(`[saveProduct] 圖片 ${idx + 1} 已上傳至 Storage:`, storageResult.url);
              return storageResult;
            } catch (storageErr) {
              console.warn(`[saveProduct] 圖片 ${idx + 1} Storage 上傳未啟用或超時，自動切換至壓縮圖片儲存:`, storageErr);
              // Fallback: 直接使用壓縮後的 Data URL 儲存，確保圖片絕不遺失且無需額外 Storage 設定
              return { url: dataUrl, path: '' };
            }
          } catch (compressErr) {
            console.error(`[saveProduct] 圖片 ${idx + 1} 處理失敗:`, compressErr);
            return null;
          }
        });

        const uploadResults = await Promise.all(uploadPromises);
        uploadedImages = uploadResults.filter(Boolean);
      }

      // 3. Combine remaining existing images and newly uploaded images
      console.log('[saveProduct] 整合圖片資料...');
      const finalImages = [...existingImages, ...uploadedImages];
      const imageUrls = finalImages.map(img => img.url);
      const imagePaths = finalImages.map(img => img.path);
      const imageUrl = imageUrls[0] || '';
      const imagePath = imagePaths[0] || '';

      // 建立向下相容的 price 欄位（取最低價）
      const prices = variants.map(v => v.price).filter(p => !isNaN(p));
      const basePrice = prices.length > 0 ? Math.min(...prices) : 0;

      const productData = {
        name,
        category: document.getElementById('pCategory').value.trim() || '精選商品',
        unit: document.getElementById('pUnit').value.trim() || '件',
        price: basePrice,
        variants,
        deadline: document.getElementById('pDeadline').value || null,
        description: document.getElementById('pDesc').value.trim(),
        status: document.getElementById('pStatus').value,
        imageUrl,
        imagePath,
        imageUrls,
        imagePaths,
        updatedAt: serverTimestamp()
      };

      console.log('[saveProduct] 準備寫入資料庫, Product Data:', productData);
      showLoading(true, '正在儲存商品至資料庫...');

      if (editId) {
        console.log('[saveProduct] 執行 updateDoc...');
        await withTimeout(
          updateDoc(doc(db, 'products', editId), productData),
          8000,
          '更新商品超時，請檢查 Firebase 網路連線或規則設定後重試。'
        );
        showToast('商品已更新！');
        console.log('[saveProduct] updateDoc 完成');
      } else {
        console.log('[saveProduct] 執行 addDoc...');
        await withTimeout(
          addDoc(collection(db, 'products'), {
            ...productData,
            views: 0,
            createdAt: serverTimestamp()
          }),
          8000,
          '新增商品超時，請檢查 Firebase 網路連線或規則設定後重試。'
        );
        showToast('商品已新增成功！');
        console.log('[saveProduct] addDoc 完成');
      }

      closeProductModal();
      console.log('[saveProduct] 重新載入商品列表...');
      await loadProducts();
      console.log('[saveProduct] 儲存流程全部完成！');

    } catch (err) {
      console.error('[saveProduct] 發生錯誤:', err);
      let errMsg = err.message || '請再試一次';
      if (err.code === 'permission-denied' || errMsg.includes('permission') || errMsg.includes('insufficient')) {
        errMsg = 'Firebase 資料庫權限未開放（permission-denied）。請至 Firebase Console 設定 Firestore 規則為 allow read, write: if true;';
      }
      showToast('儲存失敗：' + errMsg, 'error');
    } finally {
      showLoading(false);
    }
  };

  // Delete Product
  window.openDeleteModal = (id, name) => {
    deleteTargetId = id;
    document.getElementById('deleteProductName').textContent = name;
    document.getElementById('deleteModal').classList.add('show');
  };

  window.closeDeleteModal = () => {
    document.getElementById('deleteModal').classList.remove('show');
    deleteTargetId = null;
  };

  window.confirmDelete = async () => {
    if (!deleteTargetId) return;
    const product = allProducts.find(p => p.id === deleteTargetId);
    showLoading(true);
    try {
      // Clean up all images in storage
      if (product) {
        const paths = product.imagePaths || (product.imagePath ? [product.imagePath] : []);
        for (const path of paths) {
          if (path) {
            try {
              await withTimeout(deleteObject(ref(storage, path)), 10000, '刪除圖片超時');
            } catch (e) {
              console.error('Delete image storage error on delete:', e);
            }
          }
        }
      }

      await withTimeout(deleteDoc(doc(db, 'products', deleteTargetId)), 15000, '刪除商品超時');
      showToast('商品已刪除');
      closeDeleteModal();
      await withTimeout(loadProducts(), 15000, '載入商品列表超時');
    } catch (err) {
      showToast('刪除失敗', 'error');
    } finally {
      showLoading(false);
    }
  };

  // Close modals on overlay click
  document.getElementById('productModal').addEventListener('click', function(e) {
    if (e.target === this) closeProductModal();
  });
  document.getElementById('deleteModal').addEventListener('click', function(e) {
    if (e.target === this) closeDeleteModal();
  });
</script>

</body>
