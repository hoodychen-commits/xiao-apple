<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>訂單管理 — 小蘋果後台</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- Order Detail Modal -->
<div class="modal-overlay" id="orderDetailModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">🧾 訂單詳情</h3>
      <button class="modal-close" onclick="closeOrderModal()">✕</button>
    </div>
    <div class="modal-body" id="orderDetailBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeOrderModal()">關閉</button>
      <select id="statusSelect" class="form-control" style="max-width:160px;">
        <option value="pending">⏳ 待付款</option>
        <option value="paid">✅ 已付款</option>
        <option value="shipped">📦 已出貨</option>
        <option value="cancelled">❌ 已取消</option>
      </select>
      <button class="btn btn-primary" onclick="updateOrderStatus()">更新狀態</button>
    </div>
  </div>
</div>

<div class="admin-layout">

  <aside class="admin-sidebar">
    <div class="admin-logo"><span>🍎</span> 小蘋果後台</div>
    <ul class="admin-nav">
      <li><a href="dashboard.html">📊 數據儀表板</a></li>
      <li><a href="products.html">📦 商品管理</a></li>
      <li><a href="orders.html" class="active">🧾 訂單管理</a></li>
      <li style="margin-top:auto;padding-top:24px;">
        <a href="#" onclick="handleLogout()" style="color:var(--text-light);">🚪 登出</a>
      </li>
    </ul>
    <div style="padding:16px 12px 0;border-top:1px solid var(--border);margin-top:24px;">
      <p style="font-size:0.78rem;color:var(--text-light);">登入帳號</p>
      <p style="font-size:0.85rem;color:var(--text-mid);font-weight:500;margin-top:2px;" id="userEmail">-</p>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h2 class="admin-page-title">🧾 訂單管理</h2>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="text" class="form-control" id="searchInput" placeholder="🔍 搜尋訂單編號/姓名..." style="max-width:240px;" oninput="searchOrders(this.value)">
      </div>
    </div>

    <!-- Filter Tabs -->
    <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" id="oFilterAll" onclick="filterOrders('all')">全部</button>
      <button class="btn btn-secondary btn-sm" id="oFilterPending" onclick="filterOrders('pending')">⏳ 待付款</button>
      <button class="btn btn-secondary btn-sm" id="oFilterPaid" onclick="filterOrders('paid')">✅ 已付款</button>
      <button class="btn btn-secondary btn-sm" id="oFilterShipped" onclick="filterOrders('shipped')">📦 已出貨</button>
      <button class="btn btn-secondary btn-sm" id="oFilterCancelled" onclick="filterOrders('cancelled')">❌ 已取消</button>
    </div>

    <!-- Orders Table -->
    <div class="admin-table-wrapper">
      <div id="ordersLoading" style="text-align:center;padding:48px;">
        <div class="spinner"></div>
      </div>
      <div id="ordersEmpty" style="display:none;">
        <div class="empty-state">
          <div class="empty-state-icon">🧾</div>
          <h3>尚無訂單</h3>
          <p>還沒有客人下單，請先確認商品是否有上架。</p>
        </div>
      </div>
      <table class="admin-table" id="ordersTable" style="display:none;">
        <thead>
          <tr>
            <th>訂單編號</th>
            <th>商品</th>
            <th>客人姓名</th>
            <th>手機</th>
            <th>數量</th>
            <th>金額</th>
            <th>匯款後五碼</th>
            <th>狀態</th>
            <th>下單時間</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
  import { auth, db } from '../js/firebase-config.js';
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    collection, getDocs, updateDoc, doc, query, orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  let allOrders = [];
  let currentFilter = 'all';
  let currentSearch = '';
  let currentOrderId = null;

  onAuthStateChanged(auth, user => {
    if (!user) { window.location.href = 'index.html'; return; }
    document.getElementById('userEmail').textContent = user.email;
    loadOrders();
  });

  window.handleLogout = async () => {
    await signOut(auth);
    window.location.href = 'index.html';
  };

  function showToast(msg, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type === 'error' ? 'error' : ''}`;
    toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> ${msg}`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
  }

  async function loadOrders() {
    try {
      const snap = await getDocs(collection(db, 'orders'));
      allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      allOrders.sort((a, b) => {
        const timeA = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : (a.createdAt?.seconds ? a.createdAt.seconds * 1000 : 0);
        const timeB = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : (b.createdAt?.seconds ? b.createdAt.seconds * 1000 : 0);
        return timeB - timeA;
      });
      renderOrders();
    } catch (err) {
      console.error(err);
      showToast('載入訂單失敗', 'error');
    } finally {
      document.getElementById('ordersLoading').style.display = 'none';
    }
  }

  function renderOrders() {
    let filtered = allOrders;

    if (currentFilter !== 'all') {
      filtered = filtered.filter(o => o.status === currentFilter);
    }

    if (currentSearch) {
      const s = currentSearch.toLowerCase();
      filtered = filtered.filter(o =>
        (o.orderCode || '').toLowerCase().includes(s) ||
        (o.buyerName || '').toLowerCase().includes(s) ||
        (o.productName || '').toLowerCase().includes(s) ||
        (o.bankLast5 || '').toLowerCase().includes(s)
      );
    }

    const tbody = document.getElementById('ordersTableBody');
    const table = document.getElementById('ordersTable');
    const empty = document.getElementById('ordersEmpty');

    if (filtered.length === 0) {
      table.style.display = 'none';
      empty.style.display = 'block';
      return;
    }

    table.style.display = 'table';
    empty.style.display = 'none';

    const statusMap = {
      pending: '<span class="badge badge-pending">⏳ 待付款</span>',
      paid: '<span class="badge badge-paid">✅ 已付款</span>',
      shipped: '<span class="badge" style="background:#E8F0FF;color:#4B6FD4;">📦 已出貨</span>',
      cancelled: '<span class="badge badge-danger">❌ 已取消</span>'
    };

    tbody.innerHTML = filtered.map(order => {
      const createdAt = order.createdAt?.toDate
        ? order.createdAt.toDate().toLocaleDateString('zh-TW', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})
        : '-';

      const bankLast5Badge = order.bankLast5
        ? `<span class="bank-last5-badge">末五碼 ${escapeHtml(order.bankLast5)}</span>`
        : `<span style="color:var(--text-light);font-size:0.8rem;">⏳ 待回填</span>`;

      return `
        <tr>
          <td style="font-family:monospace;font-weight:700;color:var(--primary);font-size:0.85rem;">${order.orderCode || '-'}</td>
          <td style="max-width:160px;font-size:0.88rem;">${escapeHtml(order.productName || '-')}${order.variantName ? `<br><small style="color:var(--text-light)">規格: ${escapeHtml(order.variantName)}</small>` : ''}</td>
          <td style="font-weight:500;">${escapeHtml(order.buyerName || '-')}</td>
          <td style="font-size:0.88rem;color:var(--text-mid);">${escapeHtml(order.buyerPhone || '-')}</td>
          <td>${order.quantity || 1} ${order.productUnit || '件'}</td>
          <td style="font-weight:700;color:var(--primary);">NT$ ${Number(order.totalAmount || 0).toLocaleString()}</td>
          <td>${bankLast5Badge}</td>
          <td>${statusMap[order.status] || '-'}</td>
          <td style="font-size:0.8rem;color:var(--text-light);">${createdAt}</td>
          <td>
            <button class="btn btn-secondary btn-sm" onclick="openOrderDetail('${order.id}')">詳情</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  window.filterOrders = (filter) => {
    currentFilter = filter;
    ['All','Pending','Paid','Shipped','Cancelled'].forEach(f => {
      const el = document.getElementById(`oFilter${f}`);
      if (el) { el.classList.remove('btn-primary'); el.classList.add('btn-secondary'); }
    });
    const key = filter.charAt(0).toUpperCase() + filter.slice(1);
    document.getElementById(`oFilter${key}`)?.classList.replace('btn-secondary','btn-primary');
    renderOrders();
  };

  window.searchOrders = (value) => {
    currentSearch = value;
    renderOrders();
  };

  window.openOrderDetail = (id) => {
    const order = allOrders.find(o => o.id === id);
    if (!order) return;
    currentOrderId = id;

    const createdAt = order.createdAt?.toDate
      ? order.createdAt.toDate().toLocaleString('zh-TW')
      : '-';

    document.getElementById('orderDetailBody').innerHTML = `
      <div style="display:grid;gap:12px;">
        <div style="background:var(--bg-section);border-radius:var(--radius-sm);padding:16px;">
          <div style="font-size:0.78rem;color:var(--text-light);margin-bottom:4px;">訂單編號</div>
          <div style="font-family:monospace;font-weight:700;color:var(--primary);font-size:1.1rem;">${order.orderCode || '-'}</div>
        </div>

        <!-- Bank Reconciliation Box -->
        <div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:var(--radius-sm);padding:14px;">
          <div style="font-size:0.8rem;color:#1E40AF;font-weight:600;margin-bottom:4px;">🏦 買家匯款對帳資訊</div>
          <div style="font-size:1.1rem;font-weight:800;color:#1D4ED8;font-family:monospace;">
            ${order.bankLast5 ? `末五碼：${escapeHtml(order.bankLast5)}` : '⏳ 買家尚未回填末五碼'}
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div>
            <div style="font-size:0.82rem;color:var(--text-light);margin-bottom:4px;">商品</div>
            <div style="font-weight:500;">${escapeHtml(order.productName)} ${order.variantName ? `(${escapeHtml(order.variantName)})` : ''}</div>
          </div>
          <div>
            <div style="font-size:0.82rem;color:var(--text-light);margin-bottom:4px;">應付金額</div>
            <div style="font-weight:700;color:var(--primary);">NT$ ${Number(order.totalAmount || 0).toLocaleString()}</div>
          </div>
          <div>
            <div style="font-size:0.82rem;color:var(--text-light);margin-bottom:4px;">數量</div>
            <div>${order.quantity} ${order.productUnit || '件'}</div>
          </div>
          <div>
            <div style="font-size:0.82rem;color:var(--text-light);margin-bottom:4px;">付款方式</div>
            <div>${order.paymentMethod || '銀行轉帳'}</div>
          </div>
        </div>
        <hr style="border:none;border-top:1px solid var(--border);">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div>
            <div style="font-size:0.82rem;color:var(--text-light);margin-bottom:4px;">訂購人姓名</div>
            <div style="font-weight:500;">${escapeHtml(order.buyerName)}</div>
          </div>
          <div>
            <div style="font-size:0.82rem;color:var(--text-light);margin-bottom:4px;">手機號碼</div>
            <div>${escapeHtml(order.buyerPhone)}</div>
          </div>
        </div>
        <div>
          <div style="font-size:0.82rem;color:var(--text-light);margin-bottom:4px;">收件地址</div>
          <div>${escapeHtml(order.buyerAddress || '-')}</div>
        </div>
        ${order.note ? `
        <div>
          <div style="font-size:0.82rem;color:var(--text-light);margin-bottom:4px;">備註</div>
          <div style="color:var(--text-mid);">${escapeHtml(order.note)}</div>
        </div>` : ''}
        <div>
          <div style="font-size:0.82rem;color:var(--text-light);margin-bottom:4px;">下單時間</div>
          <div style="color:var(--text-mid);font-size:0.9rem;">${createdAt}</div>
        </div>
      </div>
    `;

    document.getElementById('statusSelect').value = order.status || 'pending';
    document.getElementById('orderDetailModal').classList.add('show');
  };

  window.closeOrderModal = () => {
    document.getElementById('orderDetailModal').classList.remove('show');
    currentOrderId = null;
  };

  window.updateOrderStatus = async () => {
    if (!currentOrderId) return;
    const newStatus = document.getElementById('statusSelect').value;
    try {
      await updateDoc(doc(db, 'orders', currentOrderId), { status: newStatus, updatedAt: new Date() });
      const order = allOrders.find(o => o.id === currentOrderId);
      if (order) order.status = newStatus;
      showToast('訂單狀態已更新！');
      closeOrderModal();
      renderOrders();
    } catch (err) {
      showToast('更新失敗', 'error');
    }
  };

  document.getElementById('orderDetailModal').addEventListener('click', function(e) {
    if (e.target === this) closeOrderModal();
  });
</script>

</body>
</html>
