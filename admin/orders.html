<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>訂單管理 — 小蘋果後台</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
</head>
<body>

<div class="toast-container" id="toastContainer"></div>


<div class="admin-layout">

  <aside class="admin-sidebar">
    <div class="admin-logo"><span>🍎</span> 小蘋果後台</div>
    <ul class="admin-nav">
      <li><a href="dashboard.html">📊 數據儀表板</a></li>
      <li><a href="products.html">📦 商品管理</a></li>
      <li><a href="orders.html" class="active">🧾 訂單管理</a></li>
      <li style="margin-top:auto;padding-top:24px;">
        <a href="#" onclick="handleLogout()" style="color:var(--text-light);">🚪 登出</a>
      </li>
    </ul>
    <div style="padding:16px 12px 0;border-top:1px solid var(--border);margin-top:24px;">
      <p style="font-size:0.78rem;color:var(--text-light);">登入帳號</p>
      <p style="font-size:0.85rem;color:var(--text-mid);font-weight:500;margin-top:2px;" id="userEmail">-</p>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h2 class="admin-page-title">🧾 訂單管理</h2>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="text" class="form-control" id="searchInput" placeholder="🔍 搜尋姓名/電話/地址/末五碼/訂單號..." style="min-width:280px;" oninput="searchOrders(this.value)">
      </div>
    </div>

    <!-- Filter Tabs -->
    <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" id="oFilterAll" onclick="filterOrders('all')">全部訂單</button>
      <button class="btn btn-secondary btn-sm" id="oFilterPending" onclick="filterOrders('pending')">⏳ 待付款</button>
      <button class="btn btn-secondary btn-sm" id="oFilterPaid" onclick="filterOrders('paid')">✅ 已付款</button>
      <button class="btn btn-secondary btn-sm" id="oFilterShipped" onclick="filterOrders('shipped')">📦 已出貨</button>
      <button class="btn btn-secondary btn-sm" id="oFilterCancelled" onclick="filterOrders('cancelled')">❌ 已取消</button>
    </div>

    <!-- Orders Table -->
    <div class="admin-table-wrapper">
      <div id="ordersLoading" style="text-align:center;padding:48px;">
        <div class="spinner"></div>
      </div>
      <div id="ordersEmpty" style="display:none;">
        <div class="empty-state">
          <div class="empty-state-icon">🧾</div>
          <h3>尚無符合條件的訂單</h3>
          <p>請更換搜尋關鍵字或篩選分類。</p>
        </div>
      </div>
      <table class="admin-table" id="ordersTable" style="display:none;">
        <thead>
          <tr>
            <th>訂單編號</th>
            <th>訂購商品</th>
            <th>訂購人 / 電話</th>
            <th>收貨地址</th>
            <th>數量 / 金額</th>
            <th>銀行後五碼</th>
            <th>付款確認 (打勾)</th>
            <th>出貨確認 (打勾)</th>
            <th>訂單狀態</th>
            <th>下單時間</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Order Detail Modal -->
<div class="modal-overlay" id="orderDetailModal">
  <div class="modal" style="max-width:620px;">
    <div class="modal-header">
      <h3 class="modal-title">🧾 訂單完整資訊</h3>
      <button class="modal-close" onclick="closeOrderModal()">✕</button>
    </div>
    <div class="modal-body" id="orderDetailBody"></div>
    <div class="modal-footer" style="display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-top:1px solid var(--border);background:var(--bg);flex-wrap:wrap;gap:10px;">
      <button class="btn btn-danger-outline btn-sm" onclick="deleteOrder(currentOrderId)" title="刪除此筆訂單資料">🗑️ 刪除此訂單</button>
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:0.85rem;font-weight:600;color:var(--text-dark);">手動狀態：</span>
        <select class="form-control" id="statusSelect" style="width:auto;padding:6px 12px;font-size:0.85rem;">
          <option value="pending">⏳ 待付款</option>
          <option value="paid">✅ 已付款</option>
          <option value="shipped">📦 已出貨</option>
          <option value="cancelled">❌ 已取消</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="updateOrderStatus()">變更</button>
        <button class="btn btn-secondary btn-sm" onclick="closeOrderModal()">關閉</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { auth, db } from '../js/firebase-config.js';
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    collection, getDocs, updateDoc, deleteDoc, doc, query, orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  let allOrders = [];
  let currentFilter = 'all';
  let currentSearch = '';
  let currentOrderId = null;

  onAuthStateChanged(auth, user => {
    if (!user) { window.location.href = 'index.html'; return; }
    document.getElementById('userEmail').textContent = user.email;
    loadOrders();
  });

  window.handleLogout = async () => {
    await signOut(auth);
    window.location.href = 'index.html';
  };

  function showToast(msg, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type === 'error' ? 'error' : ''}`;
    toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> ${msg}`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
  }

  async function loadOrders() {
    try {
      const snap = await getDocs(collection(db, 'orders'));
      allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      allOrders.sort((a, b) => {
        const timeA = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : (a.createdAt?.seconds ? a.createdAt.seconds * 1000 : 0);
        const timeB = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : (b.createdAt?.seconds ? b.createdAt.seconds * 1000 : 0);
        return timeB - timeA;
      });
      renderOrders();
    } catch (err) {
      console.error(err);
      showToast('載入訂單失敗', 'error');
    } finally {
      document.getElementById('ordersLoading').style.display = 'none';
    }
  }

  function renderOrders() {
    let filtered = allOrders;

    if (currentFilter !== 'all') {
      filtered = filtered.filter(o => o.status === currentFilter);
    }

    if (currentSearch) {
      const s = currentSearch.toLowerCase().trim();
      filtered = filtered.filter(o =>
        (o.orderCode || '').toLowerCase().includes(s) ||
        (o.buyerName || '').toLowerCase().includes(s) ||
        (o.buyerPhone || '').toLowerCase().includes(s) ||
        (o.buyerAddress || '').toLowerCase().includes(s) ||
        (o.productName || '').toLowerCase().includes(s) ||
        (o.bankLast5 || '').toLowerCase().includes(s)
      );
    }

    const tbody = document.getElementById('ordersTableBody');
    const table = document.getElementById('ordersTable');
    const empty = document.getElementById('ordersEmpty');

    if (filtered.length === 0) {
      table.style.display = 'none';
      empty.style.display = 'block';
      return;
    }

    table.style.display = 'table';
    empty.style.display = 'none';

    const statusMap = {
      pending: '<span class="badge badge-pending">⏳ 待付款</span>',
      paid: '<span class="badge badge-paid">✅ 已付款</span>',
      shipped: '<span class="badge" style="background:#E8F0FF;color:#4B6FD4;">📦 已出貨</span>',
      cancelled: '<span class="badge badge-danger">❌ 已取消</span>'
    };

    tbody.innerHTML = filtered.map(order => {
      const createdAt = order.createdAt?.toDate
        ? order.createdAt.toDate().toLocaleDateString('zh-TW', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})
        : '-';

      const bankLast5Badge = order.bankLast5
        ? `<span class="bank-last5-badge">末五碼 ${escapeHtml(order.bankLast5)}</span>`
        : `<span style="color:var(--text-light);font-size:0.8rem;">⏳ 待回填</span>`;

      const isPaid = order.status === 'paid' || order.status === 'shipped' || Boolean(order.isBankVerified);
      const isShipped = order.status === 'shipped' || Boolean(order.isShipped);

      const payBtnHtml = isPaid
        ? `<button class="btn-verify-toggle verified" onclick="togglePaymentStatus('${order.id}', false)" title="點擊取消付款確認">✅ 已付款</button>`
        : `<button class="btn-verify-toggle unverified" onclick="togglePaymentStatus('${order.id}', true)" title="確認後五碼正確，點擊打勾確認付款">⬜ 確認付款</button>`;

      const shipBtnHtml = isShipped
        ? `<button class="btn-ship-toggle shipped" onclick="toggleShippingStatus('${order.id}', false)" title="點擊取消出貨">📦 已出貨</button>`
        : `<button class="btn-ship-toggle unshipped" onclick="toggleShippingStatus('${order.id}', true)" title="商品已寄出，點擊打勾確認出貨">⬜ 確認出貨</button>`;

      return `
        <tr>
          <td style="font-family:monospace;font-weight:700;color:var(--primary);font-size:0.85rem;">${order.orderCode || '-'}</td>
          <td style="max-width:130px;font-size:0.88rem;">
            <strong>${escapeHtml(order.productName || '-')}</strong>
            ${order.variantName ? `<br><small style="color:var(--text-mid);background:#FFF0F4;padding:1px 6px;border-radius:4px;">規格: ${escapeHtml(order.variantName)}</small>` : ''}
          </td>
          <td>
            <div class="order-customer-box">
              <div class="order-customer-name">👤 ${escapeHtml(order.buyerName || '-')}</div>
              <div class="order-customer-phone">📞 ${escapeHtml(order.buyerPhone || '-')}</div>
            </div>
          </td>
          <td>
            <div class="order-customer-address">
              📍 ${escapeHtml(order.buyerAddress || '-')}
            </div>
          </td>
          <td>
            <div style="font-size:0.85rem;">${order.quantity || 1} ${order.productUnit || '件'}</div>
            <div style="font-weight:700;color:var(--primary);font-size:0.95rem;">NT$ ${Number(order.totalAmount || 0).toLocaleString()}</div>
          </td>
          <td>
            ${bankLast5Badge}
          </td>
          <td>
            ${payBtnHtml}
          </td>
          <td>
            ${shipBtnHtml}
          </td>
          <td>${statusMap[order.status] || '-'}</td>
          <td style="font-size:0.78rem;color:var(--text-light);white-space:nowrap;">${createdAt}</td>
          <td>
            <div style="display:flex;gap:6px;align-items:center;">
              <button class="btn btn-secondary btn-sm" onclick="openOrderDetail('${order.id}')">詳情</button>
              <button class="btn btn-danger-outline btn-sm" onclick="deleteOrder('${order.id}')" title="刪除此筆訂單資料">刪除</button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  window.filterOrders = (filter) => {
    currentFilter = filter;
    ['All','Pending','Paid','Shipped','Cancelled'].forEach(f => {
      const el = document.getElementById(`oFilter${f}`);
      if (el) { el.classList.remove('btn-primary'); el.classList.add('btn-secondary'); }
    });
    const key = filter.charAt(0).toUpperCase() + filter.slice(1);
    document.getElementById(`oFilter${key}`)?.classList.replace('btn-secondary','btn-primary');
    renderOrders();
  };

  window.searchOrders = (value) => {
    currentSearch = value;
    renderOrders();
  };

  // Toggle Payment Status (Bank Reconciliation Checkmark)
  window.togglePaymentStatus = async (orderId, targetPaid) => {
    const order = allOrders.find(o => o.id === orderId);
    if (!order) return;

    try {
      const updateData = {
        isBankVerified: targetPaid,
        updatedAt: new Date()
      };

      if (targetPaid) {
        updateData.status = 'paid';
        updateData.paidAt = new Date();
        order.status = 'paid';
        order.isBankVerified = true;
      } else {
        updateData.status = 'pending';
        updateData.isShipped = false;
        order.status = 'pending';
        order.isBankVerified = false;
        order.isShipped = false;
      }

      await updateDoc(doc(db, 'orders', orderId), updateData);
      showToast(targetPaid ? '✅ 已確認付款（末五碼正確）！' : '已切換為待付款狀態');
      renderOrders();

      if (currentOrderId === orderId) {
        openOrderDetail(orderId);
      }
    } catch (err) {
      console.error(err);
      showToast('更新付款狀態失敗', 'error');
    }
  };

  // Toggle Shipping Status (Shipment Checkmark)
  window.toggleShippingStatus = async (orderId, targetShipped) => {
    const order = allOrders.find(o => o.id === orderId);
    if (!order) return;

    try {
      const updateData = {
        isShipped: targetShipped,
        updatedAt: new Date()
      };

      if (targetShipped) {
        updateData.status = 'shipped';
        updateData.isBankVerified = true; // Auto mark payment confirmed if shipped
        updateData.shippedAt = new Date();
        order.status = 'shipped';
        order.isShipped = true;
        order.isBankVerified = true;
      } else {
        updateData.status = 'paid';
        order.status = 'paid';
        order.isShipped = false;
      }

      await updateDoc(doc(db, 'orders', orderId), updateData);
      showToast(targetShipped ? '📦 已確認出貨！' : '已切換為已付款（待出貨）');
      renderOrders();

      if (currentOrderId === orderId) {
        openOrderDetail(orderId);
      }
    } catch (err) {
      console.error(err);
      showToast('更新出貨狀態失敗', 'error');
    }
  };

  // Delete Order Record
  window.deleteOrder = async (orderId) => {
    if (!orderId) return;
    const order = allOrders.find(o => o.id === orderId);
    if (!order) return;

    const confirmMsg = `確定要刪除這筆訂單資料嗎？\n\n・訂單編號：${order.orderCode || '-'}\n・訂購人：${order.buyerName || '-'}\n・電話：${order.buyerPhone || '-'}\n・金額：NT$ ${Number(order.totalAmount || 0).toLocaleString()}\n\n⚠️ 刪除後資料將無法復原！`;

    if (!confirm(confirmMsg)) return;

    try {
      await deleteDoc(doc(db, 'orders', orderId));
      allOrders = allOrders.filter(o => o.id !== orderId);
      showToast('🗑️ 訂單資料已成功刪除！');
      if (currentOrderId === orderId) {
        closeOrderModal();
      }
      renderOrders();
    } catch (err) {
      console.error(err);
      showToast('刪除訂單失敗，請稍後再試', 'error');
    }
  };

  window.openOrderDetail = (id) => {
    const order = allOrders.find(o => o.id === id);
    if (!order) return;
    currentOrderId = id;

    const createdAt = order.createdAt?.toDate
      ? order.createdAt.toDate().toLocaleString('zh-TW')
      : '-';

    const isPaid = order.status === 'paid' || order.status === 'shipped' || Boolean(order.isBankVerified);
    const isShipped = order.status === 'shipped' || Boolean(order.isShipped);

    document.getElementById('orderDetailBody').innerHTML = `
      <div style="display:grid;gap:14px;">
        <div style="background:var(--bg-section);border-radius:var(--radius-sm);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-size:0.78rem;color:var(--text-light);margin-bottom:2px;">訂單編號</div>
            <div style="font-family:monospace;font-weight:700;color:var(--primary);font-size:1.15rem;">${order.orderCode || '-'}</div>
          </div>
          <div>
            <div style="font-size:0.78rem;color:var(--text-light);margin-bottom:2px;">下單時間</div>
            <div style="color:var(--text-mid);font-size:0.85rem;">${createdAt}</div>
          </div>
        </div>

        <!-- Checkmark Controls for Payment & Shipping -->
        <div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:var(--radius-sm);padding:16px;display:grid;gap:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border-bottom:1px solid #EDF2F7;padding-bottom:10px;">
            <div>
              <div style="font-size:0.8rem;color:#1E40AF;font-weight:600;">🏦 買家匯款末五碼</div>
              <div style="font-size:1.15rem;font-weight:800;color:#1D4ED8;font-family:monospace;margin-top:2px;">
                ${order.bankLast5 ? `末五碼：${escapeHtml(order.bankLast5)}` : '⏳ 尚未填寫末五碼'}
              </div>
            </div>
            <div>
              <button class="btn-verify-toggle ${isPaid ? 'verified' : 'unverified'}" onclick="togglePaymentStatus('${order.id}', ${!isPaid})" style="padding:8px 16px;font-size:0.88rem;">
                ${isPaid ? '✅ 後五碼已核對（點擊取消）' : '⬜ 打勾確認付款 ✔'}
              </button>
            </div>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
            <div>
              <div style="font-size:0.8rem;color:#374151;font-weight:600;">📦 出貨狀態</div>
              <div style="font-size:0.92rem;font-weight:700;color:${isShipped ? '#2563EB' : '#6B7280'};margin-top:2px;">
                ${isShipped ? '🚚 已出貨寄出' : '⏳ 待安排出貨'}
              </div>
            </div>
            <div>
              <button class="btn-ship-toggle ${isShipped ? 'shipped' : 'unshipped'}" onclick="toggleShippingStatus('${order.id}', ${!isShipped})" style="padding:8px 16px;font-size:0.88rem;">
                ${isShipped ? '📦 已出貨（點擊取消）' : '⬜ 打勾確認出貨 ✔'}
              </button>
            </div>
          </div>
        </div>

        <!-- Buyer Info Box -->
        <div style="background:white;border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;">
          <h4 style="font-size:0.9rem;color:var(--text-dark);margin-bottom:12px;display:flex;align-items:center;gap:6px;">
            <span>👤</span> 訂購人收貨資訊
          </h4>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:0.9rem;margin-bottom:10px;">
            <div>
              <span style="color:var(--text-light);font-size:0.8rem;display:block;">姓名</span>
              <strong style="color:var(--text-dark);font-size:1rem;">${escapeHtml(order.buyerName || '-')}</strong>
            </div>
            <div>
              <span style="color:var(--text-light);font-size:0.8rem;display:block;">手機號碼</span>
              <strong style="color:var(--text-dark);font-family:monospace;font-size:1rem;">📞 ${escapeHtml(order.buyerPhone || '-')}</strong>
            </div>
          </div>
          <div>
            <span style="color:var(--text-light);font-size:0.8rem;display:block;">收貨地址</span>
            <div style="color:var(--text-dark);font-weight:500;background:var(--bg);padding:8px 12px;border-radius:6px;margin-top:2px;">
              📍 ${escapeHtml(order.buyerAddress || '-')}
            </div>
          </div>
          ${order.note ? `
          <div style="margin-top:10px;">
            <span style="color:var(--text-light);font-size:0.8rem;display:block;">訂單備註</span>
            <div style="color:var(--text-mid);background:var(--bg-section);padding:8px 12px;border-radius:6px;font-size:0.85rem;margin-top:2px;">
              💬 ${escapeHtml(order.note)}
            </div>
          </div>` : ''}
        </div>

        <!-- Product & Amount Box -->
        <div style="background:white;border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;">
          <h4 style="font-size:0.9rem;color:var(--text-dark);margin-bottom:12px;display:flex;align-items:center;gap:6px;">
            <span>🛍️</span> 訂購商品明細
          </h4>
          <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;font-size:0.88rem;align-items:center;">
            <div>
              <strong style="color:var(--text-dark);">${escapeHtml(order.productName || '-')}</strong>
              ${order.variantName ? `<div style="font-size:0.8rem;color:var(--primary);">規格: ${escapeHtml(order.variantName)}</div>` : ''}
            </div>
            <div style="color:var(--text-mid);">${order.quantity || 1} ${order.productUnit || '件'}</div>
            <div style="font-weight:800;color:var(--primary);font-size:1.1rem;text-align:right;">NT$ ${Number(order.totalAmount || 0).toLocaleString()}</div>
          </div>
        </div>

      </div>
    `;

    document.getElementById('statusSelect').value = order.status || 'pending';
    document.getElementById('orderDetailModal').classList.add('show');
  };

  window.closeOrderModal = () => {
    document.getElementById('orderDetailModal').classList.remove('show');
    currentOrderId = null;
  };

  window.updateOrderStatus = async () => {
    if (!currentOrderId) return;
    const newStatus = document.getElementById('statusSelect').value;
    try {
      const updateData = { status: newStatus, updatedAt: new Date() };
      if (newStatus === 'paid') updateData.isBankVerified = true;
      if (newStatus === 'shipped') { updateData.isBankVerified = true; updateData.isShipped = true; }
      if (newStatus === 'pending') { updateData.isBankVerified = false; updateData.isShipped = false; }

      await updateDoc(doc(db, 'orders', currentOrderId), updateData);
      const order = allOrders.find(o => o.id === currentOrderId);
      if (order) {
        order.status = newStatus;
        if (newStatus === 'paid') order.isBankVerified = true;
        if (newStatus === 'shipped') { order.isBankVerified = true; order.isShipped = true; }
        if (newStatus === 'pending') { order.isBankVerified = false; order.isShipped = false; }
      }
      showToast('訂單狀態已更新！');
      closeOrderModal();
      renderOrders();
    } catch (err) {
      showToast('更新失敗', 'error');
    }
  };

  document.getElementById('orderDetailModal').addEventListener('click', function(e) {
    if (e.target === this) closeOrderModal();
  });
</script>

</body>
</html>
