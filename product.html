<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品詳情 — 小蘋果團購</title>
  <meta name="description" content="查看商品詳情並立即下單，小蘋果團購精選好物。">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
  <style>
    .variant-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .variant-btn {
      padding: 10px 18px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-section);
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-mid);
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 100px;
    }
    .variant-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .variant-btn.active {
      border-color: var(--primary);
      background: linear-gradient(135deg, #FFF5F5, #FFF0F0);
      color: var(--primary);
      font-weight: 600;
    }
    .variant-btn .variant-price {
      font-size: 0.82rem;
      font-weight: 700;
    }
    .variant-btn .variant-stock-info {
      font-size: 0.72rem;
      color: var(--text-light);
    }
    .variant-btn.active .variant-stock-info {
      color: var(--primary);
      opacity: 0.8;
    }
    .variant-btn.sold-out {
      opacity: 0.5;
      cursor: not-allowed;
      text-decoration: line-through;
    }
  </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- Navbar -->
<nav class="navbar">
  <a href="index.html" class="navbar-brand">
    <div class="logo-icon">🍎</div>
    小蘋果團購
  </a>
  <ul class="navbar-nav">
    <li><a href="index.html">← 返回商品列表</a></li>
  </ul>
</nav>

<!-- Loading -->
<div class="loading-overlay" id="pageLoading">
  <div class="spinner"></div>
  <p style="color:var(--text-mid)">載入中...</p>
</div>

<!-- Main Content -->
<main id="mainContent" style="display:none;">
  <div class="container" style="padding-top:40px;padding-bottom:60px;">
    <!-- Breadcrumb -->
    <nav style="margin-bottom:32px;font-size:0.85rem;color:var(--text-light);">
      <a href="index.html" style="color:var(--primary);">首頁</a>
      <span style="margin:0 8px;">›</span>
      <span id="breadcrumbName">商品詳情</span>
    </nav>

    <div class="product-detail">
      <!-- Left: Image Gallery -->
      <div class="product-detail-gallery">
        <div class="product-detail-img" id="productImg">🛍️</div>
        <div class="thumbnail-list" id="thumbnailList"></div>
      </div>

      <!-- Right: Info + Order Form -->
      <div class="product-detail-info">
        <div>
          <span class="product-card-tag" id="productCategory">精選商品</span>
          <h1 style="font-size:1.8rem;margin:12px 0 8px;" id="productName">商品名稱</h1>
          <div class="product-detail-price" id="productPrice">NT$ 0</div>
        </div>

        <!-- Variant Selector (only shown for multi-variant products) -->
        <div id="variantSelectorSection" style="display:none;">
          <div class="product-detail-meta" style="margin-bottom:0;padding-bottom:0;border:none;">
            <div class="meta-row" style="flex-direction:column;align-items:flex-start;gap:8px;">
              <span class="meta-label">🏷️ 請選擇種類</span>
              <div class="variant-selector" id="variantSelector"></div>
            </div>
          </div>
        </div>

        <div class="product-detail-meta">
          <div class="meta-row">
            <span class="meta-label">📦 單位</span>
            <span class="meta-value" id="productUnit">件</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">⏰ 截止</span>
            <span class="meta-value" id="productDeadline">長期開團</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">📊 庫存</span>
            <span class="meta-value" id="productStock">充足</span>
          </div>
        </div>

        <p style="color:var(--text-mid);font-size:0.95rem;line-height:1.8;" id="productDesc"></p>

        <!-- Order Form -->
        <div class="order-form" id="orderForm">
          <h3 style="margin-bottom:20px;font-size:1rem;color:var(--text-dark);">📝 填寫訂購資料</h3>

          <div class="form-group">
            <label class="form-label" for="buyerName">姓名 <span class="required">*</span></label>
            <input type="text" class="form-control" id="buyerName" placeholder="請輸入您的姓名">
          </div>

          <div class="form-group">
            <label class="form-label" for="buyerPhone">手機號碼 <span class="required">*</span></label>
            <input type="tel" class="form-control" id="buyerPhone" placeholder="09XX-XXX-XXX">
          </div>

          <div class="form-group">
            <label class="form-label" for="buyerAddress">收件地址 <span class="required">*</span></label>
            <input type="text" class="form-control" id="buyerAddress" placeholder="請輸入收件地址">
          </div>

          <div class="form-group">
            <label class="form-label">數量 <span class="required">*</span></label>
            <div class="qty-control">
              <button class="qty-btn" id="qtyMinus" type="button">−</button>
              <input type="number" class="qty-input" id="quantity" value="1" min="1" max="999">
              <button class="qty-btn" id="qtyPlus" type="button">+</button>
              <span style="color:var(--text-light);font-size:0.85rem;" id="qtyUnit">件</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">付款方式 <span class="required">*</span></label>
            <div class="payment-options" style="grid-template-columns: 1fr;">
              <div class="payment-option">
                <input type="radio" name="payment" id="payTransfer" value="transfer" checked>
                <label for="payTransfer" style="flex-direction: row; justify-content: center; gap: 12px; padding: 14px 20px;">
                  <span class="payment-icon" style="font-size: 1.3rem;">🏦</span>
                  銀行轉帳
                </label>
              </div>
            </div>

            <!-- Transfer Info -->
            <div class="payment-info-box show" id="transferInfo">
              <h4>🏦 銀行轉帳資訊</h4>
              <p>銀行：<strong>國泰世華 永貞分行</strong></p>
              <p>帳號：<strong>273506144813</strong></p>
              <p>戶名：<strong>鍾沛蓉</strong></p>
              <p style="margin-top:12px;font-size:0.82rem;color:var(--text-light);">轉帳後請截圖傳至我們的客服確認</p>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="buyerNote">備註（選填）</label>
            <textarea class="form-control" id="buyerNote" placeholder="如有特殊需求請備註"></textarea>
          </div>

          <!-- Order Summary -->
          <div class="order-summary" id="orderSummary">
            <div class="order-summary-row" id="summaryVariantRow" style="display:none;">
              <span>選擇種類</span>
              <span id="summaryVariant">-</span>
            </div>
            <div class="order-summary-row">
              <span>商品單價</span>
              <span id="summaryPrice">NT$ 0</span>
            </div>
            <div class="order-summary-row">
              <span>數量</span>
              <span id="summaryQty">× 1</span>
            </div>
            <div class="order-summary-row">
              <span>✨ 訂單總金額</span>
              <span id="summaryTotal">NT$ 0</span>
            </div>
          </div>

          <button class="btn btn-primary btn-block" id="submitBtn" onclick="submitOrder()">
            🎉 確認下單
          </button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Closed State -->
<div id="closedState" style="display:none;">
  <div class="success-page">
    <div class="success-card">
      <div class="success-icon" style="background:linear-gradient(135deg,var(--text-light),#ccc);">😔</div>
      <h2 class="success-title">此團購已截止</h2>
      <p class="success-desc">很遺憾，這個商品的開團期限已過，請回首頁查看其他開團商品！</p>
      <a href="index.html" class="btn btn-primary">← 回首頁看看</a>
    </div>
  </div>
</div>

<footer class="footer">
  <p>© 2026 小蘋果團購 · 好物共享，揪團更划算 🍎</p>
</footer>

<script type="module">
  import { db } from './js/firebase-config.js';
  import {
    doc, getDoc, addDoc, collection, serverTimestamp, updateDoc, increment
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const params = new URLSearchParams(window.location.search);
  const productId = params.get('id');
  let currentProduct = null;
  let selectedVariantIndex = 0;

  function showToast(msg, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type === 'error' ? 'error' : ''}`;
    toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> ${msg}`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  async function loadProduct() {
    if (!productId) {
      window.location.href = 'index.html';
      return;
    }

    try {
      const docRef = doc(db, 'products', productId);
      const docSnap = await getDoc(docRef);

      document.getElementById('pageLoading').style.display = 'none';

      if (!docSnap.exists() || docSnap.data().status !== 'active') {
        document.getElementById('closedState').style.display = 'flex';
        return;
      }

      currentProduct = { id: docSnap.id, ...docSnap.data() };

      // Check deadline
      if (currentProduct.deadline) {
        const deadline = new Date(currentProduct.deadline);
        if (deadline < new Date()) {
          document.getElementById('closedState').style.display = 'flex';
          // Update product status
          await updateDoc(docRef, { status: 'ended' });
          return;
        }
      }

      // Track view
      await updateDoc(docRef, { views: increment(1) });

      renderProduct(currentProduct);
      document.getElementById('mainContent').style.display = 'block';

    } catch (error) {
      console.error(error);
      document.getElementById('pageLoading').style.display = 'none';
      document.getElementById('closedState').style.display = 'flex';
    }
  }

  function getSelectedVariant() {
    if (currentProduct.variants && Array.isArray(currentProduct.variants) && currentProduct.variants.length > 0) {
      return currentProduct.variants[selectedVariantIndex] || currentProduct.variants[0];
    }
    // 向下相容
    return { name: '', price: currentProduct.price, stock: currentProduct.stock };
  }

  function renderProduct(product) {
    document.title = `${product.name} — 小蘋果團購`;

    document.getElementById('breadcrumbName').textContent = product.name;
    document.getElementById('productName').textContent = product.name;
    document.getElementById('productCategory').textContent = product.category || '精選商品';
    document.getElementById('productDesc').textContent = product.description || '';
    document.getElementById('productUnit').textContent = product.unit || '件';
    document.getElementById('qtyUnit').textContent = product.unit || '件';

    // Image gallery
    const thumbList = document.getElementById('thumbnailList');
    thumbList.innerHTML = '';

    if (product.imageUrls && Array.isArray(product.imageUrls) && product.imageUrls.length > 0) {
      document.getElementById('productImg').innerHTML = `<img src="${product.imageUrls[0]}" alt="${product.name}">`;
      
      if (product.imageUrls.length > 1) {
        thumbList.style.display = 'flex';
        product.imageUrls.forEach((url, i) => {
          const thumb = document.createElement('div');
          thumb.className = `thumbnail-item ${i === 0 ? 'active' : ''}`;
          thumb.innerHTML = `<img src="${url}" alt="縮圖 ${i+1}">`;
          
          const switchImg = () => {
            document.querySelectorAll('.thumbnail-item').forEach(el => el.classList.remove('active'));
            thumb.classList.add('active');
            document.getElementById('productImg').innerHTML = `<img src="${url}" alt="${product.name}">`;
          };
          
          thumb.addEventListener('click', switchImg);
          thumb.addEventListener('mouseenter', switchImg);
          thumbList.appendChild(thumb);
        });
      } else {
        thumbList.style.display = 'none';
      }
    } else if (product.imageUrl) {
      document.getElementById('productImg').innerHTML = `<img src="${product.imageUrl}" alt="${product.name}">`;
      thumbList.style.display = 'none';
    } else {
      document.getElementById('productImg').innerHTML = '🛍️';
      thumbList.style.display = 'none';
    }

    // Deadline
    if (product.deadline) {
      const d = new Date(product.deadline);
      const daysLeft = Math.ceil((d - new Date()) / (1000 * 60 * 60 * 24));
      document.getElementById('productDeadline').textContent =
        `${d.toLocaleDateString('zh-TW')}（剩 ${daysLeft} 天）`;
      if (daysLeft <= 3) {
        document.getElementById('productDeadline').style.color = 'var(--primary)';
        document.getElementById('productDeadline').style.fontWeight = '700';
      }
    }

    // Variant selector
    if (product.variants && Array.isArray(product.variants) && product.variants.length > 1) {
      renderVariantSelector(product.variants);
      document.getElementById('variantSelectorSection').style.display = 'block';
    } else {
      document.getElementById('variantSelectorSection').style.display = 'none';
    }

    // Set initial variant
    selectedVariantIndex = 0;
    updateVariantDisplay();
  }

  function renderVariantSelector(variants) {
    const selector = document.getElementById('variantSelector');
    selector.innerHTML = '';

    variants.forEach((v, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `variant-btn ${i === 0 ? 'active' : ''}`;

      const isSoldOut = v.stock !== undefined && v.stock <= 0;
      if (isSoldOut) btn.classList.add('sold-out');

      let stockText = '';
      if (v.stock !== undefined) {
        stockText = v.stock <= 0 ? '已售完' : `庫存 ${v.stock}`;
      }

      btn.innerHTML = `
        <span>${escapeHtml(v.name || '預設')}</span>
        <span class="variant-price">NT$ ${Number(v.price).toLocaleString()}</span>
        ${stockText ? `<span class="variant-stock-info">${stockText}</span>` : ''}
      `;

      btn.addEventListener('click', () => {
        if (isSoldOut) return;
        selectedVariantIndex = i;
        document.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateVariantDisplay();
      });

      selector.appendChild(btn);
    });
  }

  function updateVariantDisplay() {
    const variant = getSelectedVariant();
    const price = variant.price || 0;

    // Update price display
    document.getElementById('productPrice').textContent = `NT$ ${Number(price).toLocaleString()}`;

    // Update stock display
    const stockEl = document.getElementById('productStock');
    const submitBtn = document.getElementById('submitBtn');

    if (variant.stock !== undefined) {
      if (variant.stock <= 0) {
        stockEl.textContent = '已售完';
        stockEl.style.color = 'var(--primary)';
        submitBtn.disabled = true;
        submitBtn.textContent = '已售完';
      } else if (variant.stock <= 10) {
        stockEl.textContent = `僅剩 ${variant.stock} ${currentProduct.unit || '件'}`;
        stockEl.style.color = 'var(--primary)';
        submitBtn.disabled = false;
        submitBtn.textContent = '🎉 確認下單';
      } else {
        stockEl.textContent = `${variant.stock} ${currentProduct.unit || '件'}`;
        stockEl.style.color = '';
        submitBtn.disabled = false;
        submitBtn.textContent = '🎉 確認下單';
      }
    } else {
      stockEl.textContent = '充足';
      stockEl.style.color = '';
      submitBtn.disabled = false;
      submitBtn.textContent = '🎉 確認下單';
    }

    // Update summary
    const hasVariants = currentProduct.variants && currentProduct.variants.length > 1;
    const variantRow = document.getElementById('summaryVariantRow');
    if (hasVariants && variant.name) {
      variantRow.style.display = 'flex';
      document.getElementById('summaryVariant').textContent = variant.name;
    } else {
      variantRow.style.display = 'none';
    }

    updateSummary();
  }

  function updateSummary() {
    if (!currentProduct) return;
    const qty = parseInt(document.getElementById('quantity').value) || 1;
    const variant = getSelectedVariant();
    const price = variant.price || 0;
    const total = qty * price;

    document.getElementById('summaryPrice').textContent = `NT$ ${Number(price).toLocaleString()}`;
    document.getElementById('summaryQty').textContent = `× ${qty}`;
    document.getElementById('summaryTotal').textContent = `NT$ ${Number(total).toLocaleString()}`;
  }

  // Quantity controls
  document.getElementById('qtyPlus').addEventListener('click', () => {
    const input = document.getElementById('quantity');
    input.value = Math.min(999, parseInt(input.value || 1) + 1);
    updateSummary();
  });

  document.getElementById('qtyMinus').addEventListener('click', () => {
    const input = document.getElementById('quantity');
    input.value = Math.max(1, parseInt(input.value || 1) - 1);
    updateSummary();
  });

  document.getElementById('quantity').addEventListener('input', updateSummary);

  // Payment method toggle
  document.querySelectorAll('input[name="payment"]').forEach(radio => {
    radio.addEventListener('change', () => {
      document.getElementById('transferInfo').classList.remove('show');
      if (radio.value === 'transfer') {
        document.getElementById('transferInfo').classList.add('show');
      }
    });
  });

  // Submit Order
  window.submitOrder = async () => {
    const name = document.getElementById('buyerName').value.trim();
    const phone = document.getElementById('buyerPhone').value.trim();
    const address = document.getElementById('buyerAddress').value.trim();
    const qty = parseInt(document.getElementById('quantity').value) || 1;
    const payment = document.querySelector('input[name="payment"]:checked');
    const note = document.getElementById('buyerNote').value.trim();

    if (!name || !phone || !address) {
      showToast('請填寫姓名、手機號碼和地址', 'error');
      return;
    }

    if (!payment) {
      showToast('請選擇付款方式', 'error');
      return;
    }

    const variant = getSelectedVariant();

    // Check if selected variant has enough stock
    if (variant.stock !== undefined && variant.stock < qty) {
      showToast(`庫存不足！「${variant.name || '此商品'}」僅剩 ${variant.stock} ${currentProduct.unit || '件'}`, 'error');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '送出中...';

    try {
      const total = qty * variant.price;
      const orderCode = `AP${Date.now().toString(36).toUpperCase()}`;

      const orderData = {
        orderCode,
        productId: currentProduct.id,
        productName: currentProduct.name,
        productPrice: variant.price,
        productUnit: currentProduct.unit || '件',
        quantity: qty,
        totalAmount: total,
        buyerName: name,
        buyerPhone: phone,
        buyerAddress: address,
        paymentMethod: payment.value === 'credit' ? '刷卡' : '銀行轉帳',
        note,
        status: 'pending',
        createdAt: serverTimestamp()
      };

      // 加入種類資訊
      if (variant.name) {
        orderData.variantName = variant.name;
      }

      await addDoc(collection(db, 'orders'), orderData);

      // Save to sessionStorage for success page
      sessionStorage.setItem('lastOrder', JSON.stringify({
        orderCode,
        productName: currentProduct.name,
        variantName: variant.name || '',
        quantity: qty,
        totalAmount: total,
        paymentMethod: payment.value
      }));

      window.location.href = 'order-success.html';

    } catch (error) {
      console.error(error);
      showToast('下單失敗，請稍後再試', 'error');
      btn.disabled = false;
      btn.textContent = '🎉 確認下單';
    }
  };

  loadProduct();
</script>

</body>
</html>
